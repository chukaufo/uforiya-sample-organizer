<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:*; media-src http://127.0.0.1:*">
<title>Uforiya Sample Organizer</title>
<style>
  :root {
    --bg: #08080f;
    --panel: #10101c;
    --line: #1e1e2e;
    --text: #e8e8f0;
    --dim: #8a8aa0;
    --accent: #7b5ff5;
    --accent-lit: #9b7ff7;
    --error: #ff4d4d;
    --good: #5fd38d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .brand { font-weight: 600; letter-spacing: -0.2px; }
  .brand span { color: var(--accent-lit); }
  .spacer { flex: 1; }

  button {
    font: inherit;
    font-weight: 500;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: var(--accent-lit); }
  button.danger { color: var(--error); }
  button.small { padding: 4px 10px; font-size: 12px; border-radius: 8px; }

  main { flex: 1; overflow-y: auto; padding: 24px; }

  .center {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  .center p { color: var(--dim); max-width: 380px; margin: 0; }

  .stats {
    display: flex;
    gap: 40px;
    padding: 18px 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .stat-label { color: var(--dim); font-size: 12px; }
  .stat-of { color: var(--dim); font-size: 12px; margin-top: 2px; }

  .group {
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .group-head {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    background: var(--panel);
  }
  .group-head:hover { background: #151524; }
  .chevron { color: var(--dim); font-size: 11px; width: 10px; }
  .group.open .chevron { transform: rotate(90deg); }
  .reclaim { font-weight: 600; min-width: 160px; }
  .badge {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .badge.reenc { color: var(--accent-lit); border-color: var(--accent); }

  .files { display: none; }
  .group.open .files { display: block; }

  .file {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 16px 10px 40px;
    border-top: 1px solid var(--line);
  }
  .file input[type=checkbox] {
    margin-top: 4px;
    accent-color: var(--accent);
    cursor: pointer;
    width: 15px;
    height: 15px;
  }
  .play {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 999px;
    font-size: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play.playing { background: var(--accent); border-color: var(--accent); }
  .file-main { flex: 1; min-width: 0; }
  .file-name { word-break: break-all; }
  .file-path {
    color: var(--dim);
    font-size: 11px;
    font-family: ui-monospace, "JetBrains Mono", monospace;
    word-break: break-all;
    user-select: text;
  }
  .keep { color: var(--good); font-size: 11px; font-weight: 600; }

  .bar {
    padding: 12px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    background: var(--panel);
  }

  .progress {
    height: 3px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    flex: 1;
  }
  .progress div { height: 100%; background: var(--accent); width: 0; }

  .mono {
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .batch {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
  }

  /* ── Quarantine batch contents ──
     A batch is 568 of a producer's samples. "568 files" is a number, not
     an answer to the only question that matters: which ones. The row
     opens into the same list the library view uses. */
  .qbatch {
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  /* The head keeps .batch's layout but gives up its own frame to the
     wrapper, so an open batch reads as one card rather than two. */
  .qbatch .batch {
    border: none;
    border-radius: 0;
    margin-bottom: 0;
    cursor: pointer;
  }
  .qbatch .batch:hover { background: #151524; }
  .qbatch.open .chevron { transform: rotate(90deg); }

  .qfiles {
    display: none;
    /* A batch can hold thousands. Capped so the list scrolls inside the
       card instead of burying every other batch below it. */
    max-height: 420px;
    overflow-y: auto;
  }
  .qbatch.open .qfiles { display: block; }

  .qfile {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 16px 10px 40px;
    border-top: 1px solid var(--line);
  }
  /* Sits at the end of the row rather than beside the play button, so the
     control that moves a file is never next to the one that plays it. */
  .qfile .small { flex-shrink: 0; margin-top: 2px; }

  /* Its own field rather than the header's. The header search means
     "find a duplicate group"; this one means "find a file I removed",
     and one box doing both would be two different questions. */
  .qsearch {
    font: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    width: 320px;
    outline: none;
    margin-bottom: 8px;
  }
  .qsearch:focus { border-color: var(--accent); }
  .qsearch::placeholder { color: var(--dim); }

  .error {
    background: #2a1116;
    border: 1px solid var(--error);
    color: #ffb3b3;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }

  .notice {
    background: #14142a;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .notice div {
    user-select: text;   /* the path is there to be copied */
    font-size: 13px;
  }
  .actions {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 20px;
  }
  .hint { color: var(--dim); font-size: 12px; }

  /* ── Onboarding ──
     What a producer needs to know before they trust this with a library
     they paid for, and before they wonder why the file count looks low. */
  .onboard {
    max-width: 560px;
    text-align: left;
    margin: 0 auto;
  }
  .onboard-line {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 1.55;
    color: var(--dim);
  }
  .onboard-line:first-of-type { border-top: none; }
  .onboard-line strong {
    display: block;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .onboard-mark {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    margin-top: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .onboard-mark.good { background: var(--good); }

  /* Inline explainer next to a control, opened by the ⓘ beside it. */
  .info-btn {
    width: 18px;
    height: 18px;
    padding: 0;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    color: var(--dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: 1px;
    margin-left: 6px;
  }
  .info-panel {
    max-width: 560px;
    margin: 0 0 20px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--dim);
  }
  .info-panel strong { color: var(--text); font-weight: 600; }

  /* ── Guide ──
     Points at the real controls rather than showing pictures of them. A
     screenshot goes stale the first time a button moves. */
  .guide-step {
    display: flex;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .guide-step:last-child { border-bottom: none; }
  .guide-num {
    flex-shrink: 0;
    width: 24px;
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--dim);
    padding-top: 3px;
  }
  .guide-body h4 {
    margin: 0 0 5px;
    font-size: 14px;
    font-weight: 600;
  }
  .guide-body p {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--dim);
  }
  .guide-body p + p { margin-top: 8px; }
  .guide-body em {
    font-style: normal;
    color: var(--text);
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 12px;
  }

  /* Draws a ring around a real control while the guide explains it. */
  .spotlight {
    position: relative;
    z-index: 4;
    box-shadow: 0 0 0 2px var(--accent), 0 0 0 9px rgba(123, 95, 245, 0.18);
    border-radius: 12px;
  }

  /* A full-width bar the work reports into, so a producer is never left
     watching a frozen window wondering whether 400 files are moving. */
  .working {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: rgba(8, 8, 15, 0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .working-label { font-weight: 600; }
  .working-detail { color: var(--dim); font-size: 12px; }
  .working-track {
    width: 320px;
    height: 3px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .working-track div { height: 100%; background: var(--accent); width: 0; }

  #btn-more {
    display: block;
    margin: 4px auto 0;
  }

  /* Sits under the header rather than inside main, so a view change or a
     rescan redraw cannot wipe it half-read. */
  #update-bar {
    border-top: none;
    border-bottom: 1px solid var(--line);
  }

  /* Icon inside the control's own border, so the arrows read as part of
     the dropdown rather than a button sitting beside it. */
  .sort {
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding-left: 10px;
  }
  .sort:focus-within { border-color: var(--accent); }
  .sort-icon { color: var(--dim); font-size: 14px; line-height: 1; }
  .sort select {
    border: none;
    background: none;
    border-radius: 0;
    padding-left: 6px;
  }

  #search {
    font: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 7px 12px;
    width: 260px;
    margin-left: 18px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }

  select {
    font: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 7px 10px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  .reclaim-label { color: var(--dim); font-weight: 400; font-size: 12px; }

  .file-size {
    color: var(--dim);
    font-size: 11px;
    font-family: ui-monospace, "JetBrains Mono", monospace;
    margin-left: 8px;
  }

  mark {
    background: rgba(123, 95, 245, 0.32);
    color: var(--text);
    border-radius: 3px;
    padding: 0 1px;
  }
  /* The star field sits behind everything and never intercepts a click —
     a producer aiming at a checkbox must never hit the background. */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  header, main, .bar { position: relative; z-index: 1; }

  .brand-mark {
    height: 44px;
    vertical-align: -14px;
    margin-right: 12px;
  }

  /* Icon-only, so Settings costs a square rather than a word in a header
     that already carries four buttons. */
  button.icon {
    padding: 7px 11px;
    font-size: 19px;
    line-height: 1;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--dim);
    padding: 8px 12px;
  }
  .tab:hover:not(.active) { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }</style>
</head>
<body>

<canvas id="stars"></canvas>

<header>
  <div class="brand" id="btn-home" style="cursor:pointer">
    <img src="assets/ufologo.png" alt="" class="brand-mark">Uforiya <span>Sample Organizer</span>
  </div>
  <input id="search" type="search" placeholder="Search by sample name" autocomplete="off" spellcheck="false">
  <div class="spacer"></div>
  <button id="btn-back" style="display:none">← Back</button>
  <button id="btn-quarantine-view">Quarantine</button>
  <button id="btn-rescan">Rescan</button>
  <button id="btn-add" class="primary">Add folder</button>
  <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
</header>

<div class="bar" id="update-bar" style="display:none">
  <span id="update-text"></span>
  <div class="spacer"></div>
  <button id="btn-update-get" class="primary">Get the update</button>
  <button id="btn-update-dismiss">Not now</button>
</div>

<main id="main"></main>

<div class="bar" id="bar" style="display:none">
  <span id="phase" style="min-width:80px"></span>
  <div class="progress"><div id="progress-fill"></div></div>
  <span class="mono" id="current-path"></span>
  <button id="btn-cancel">Cancel</button>
</div>

<div class="bar" id="action-bar" style="display:none">
  <span id="selection-count"></span>
  <div class="spacer"></div>
  <button id="btn-clear">Clear selection</button>
  <button id="btn-remove" class="primary">Move to quarantine</button>
</div>

<script>
// Renderer: displays what the worker decides, and sends commands back.
//
// It holds selection state, playback state, and which groups are open.
// Nothing else. Every question about which files are duplicates, what is
// safe to remove, and where files go is answered by the worker — which is
// why a bug in here cannot lose a producer a sample.

let API = null;
let TOKEN = null;
let AUTH = null;

const selected = new Set();   // file ids ticked for removal
const openGroups = new Set(); // group ids expanded, so a redraw keeps them
const groupFiles = new Map(); // group id -> files, cached after first open
let groups = [];        // groups currently rendered — one page or many
let totals = null;
let view = 'library';
let query = '';
let sortBy = 'reclaimable';
let searchTimer = null;
let pagesLoaded = 0;    // how many pages of the current result set are on screen
let totalGroups = 0;    // how many exist for the current search, per the worker
let recoveryNoticeShown = false;  // recovery is per launch; say it once, not every visit

const PAGE_SIZE = 200;

// One sound at a time. A producer comparing two copies wants to hear one
// then the other, not both at once.
let audio = null;
let playingId = null;
// Incremented on every play or stop. A callback that comes back holding a
// stale number belongs to a sound that has already been replaced, and must
// not touch what is playing now.
let playToken = 0;
const el = (id) => document.getElementById(id);
const main = el('main');


// ── Worker calls ────────────────────────────────────────────────────────────

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      Authorization: AUTH,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || 'Request failed');
  return body;
}

function bytes(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  // Per-file sizes made KB worth having: a 200KB hat rendered as
  // "0.2 MB" reads as a rounding error rather than a real size.
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

// Wraps whatever the producer searched for, so a group that came back on
// one odd filename shows which one it was rather than looking arbitrary.
function highlight(value) {
  const safe = escapeHtml(value);
  if (!query) return safe;
  const pattern = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), (hit) => `<mark>${hit}</mark>`);
}

const count = (n) => n.toLocaleString();

async function groupDetail(groupId) {
  if (groupFiles.has(groupId)) return groupFiles.get(groupId);
  const detail = await api('/duplicates/' + encodeURIComponent(groupId));
  groupFiles.set(groupId, detail.files);
  return detail.files;
}


// ── Playback ────────────────────────────────────────────────────────────────

function stopAudio() {
  playToken++;
  if (audio) {
    audio.pause();
    audio.src = '';   // drops the pending request rather than leaving it in flight
    audio = null;
  }
  playingId = null;
  document.querySelectorAll('.play.playing').forEach((b) => {
    b.classList.remove('playing');
    b.textContent = '▶';
  });
}

// `key` is what identifies the playing sound, so its button can be
// un-highlighted; `path` is the worker route it comes from. A quarantined
// file is served from its staging copy under a different route, because
// it is no longer at the location the library knows it by.
function togglePlay(key, button, path) {
  if (playingId === key) {
    stopAudio();
    return;
  }
  stopAudio();

  const mine = ++playToken;

  // Token in the query string: an <audio> element cannot set request
  // headers, same constraint as EventSource.
  const sound = new Audio(`${API}${path}?token=${encodeURIComponent(TOKEN)}`);
  audio = sound;
  playingId = key;
  button.classList.add('playing');
  button.textContent = '■';

  sound.onended = () => { if (mine === playToken) stopAudio(); };

  sound.onerror = () => {
    if (mine !== playToken) return;
    stopAudio();
    showError('That file could not be played.');
  };

  // Clicking a second sample while the first is still starting makes the
  // first play() reject with AbortError — that is this code doing its job,
  // not a failure, and it must not stop the sample that replaced it or
  // claim that one is broken.
  sound.play().catch((err) => {
    if (mine !== playToken || err.name === 'AbortError') return;
    stopAudio();
    showError('That file could not be played.');
  });
}


// ── Scanning ────────────────────────────────────────────────────────────────

// Raw phase names come straight from the worker's internal job states —
// "walking", "hashing" — which mean nothing to a producer. This is the only
// place they get translated before hitting the screen.
const PHASE_LABELS = {
  walking: 'Scanning folders',
  hashing: 'Checking for duplicates',
};

function watchJob(jobId) {
  el('bar').style.display = 'flex';
  el('action-bar').style.display = 'none';

  const stream = new EventSource(
    `${API}/jobs/${jobId}/events?token=${encodeURIComponent(TOKEN)}`
  );

  stream.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (['completed', 'cancelled', 'failed'].includes(data.phase)) {
      stream.close();
      el('bar').style.display = 'none';
      if (data.phase === 'failed') showError(data.error);
      // The index changed, so cached group contents are stale.
      groupFiles.clear();
      loadLibrary();
      return;
    }

    el('phase').textContent = PHASE_LABELS[data.phase] || data.phase;
    el('current-path').textContent = data.current_path || '';
    const pct = data.total ? (data.done / data.total) * 100 : 0;
    el('progress-fill').style.width = pct + '%';
  };
  stream.onerror = () => {
    stream.close();
    el('bar').style.display = 'none';
    loadLibrary();
  };

  el('btn-cancel').onclick = () => api(`/jobs/${jobId}/cancel`, { method: 'POST' });
}


// ── Library view ────────────────────────────────────────────────────────────

function showError(message) {
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = message;
  main.prepend(div);
  setTimeout(() => div.remove(), 8000);
}

// Something the producer needs to know that is not a failure. Stays put
// until dismissed — a path they may need to go and look at should not
// vanish on a timer while they are reading it.
function showNotice(message) {
  const div = document.createElement('div');
  div.className = 'notice';
  div.innerHTML = `<div style="flex:1">${escapeHtml(message)}</div>`;

  const close = document.createElement('button');
  close.className = 'small';
  close.textContent = 'Got it';
  close.onclick = () => div.remove();

  div.appendChild(close);
  main.prepend(div);
}

// Shown for work that takes long enough to look like a hang. Selecting
// across 400 groups is 400 round trips, and moving 400 files is 400 file
// operations — neither is instant, and silence during either is the
// difference between "it's working" and "it's broken".
function showWorking(label) {
  const overlay = document.createElement('div');
  overlay.className = 'working';
  overlay.innerHTML = `
    <div class="working-label">${escapeHtml(label)}</div>
    <div class="working-track"><div></div></div>
    <div class="working-detail"></div>`;
  document.body.appendChild(overlay);

  return {
    update(done, total, detail) {
      overlay.querySelector('.working-track div').style.width =
        total ? (done / total) * 100 + '%' : '0';
      overlay.querySelector('.working-detail').textContent = detail || '';
    },
    done() { overlay.remove(); },
  };
}

  // Every figure is shown against the library's own total. A count with no

  el('btn-keep-info').onclick = () => {

  el('list-note').textContent = query

    list.innerHTML = `<p class="hint">No duplicate groups contain a sample named "${escapeHtml(query)}".</p>`;

  }

  groups.forEach((group) => list.appendChild(renderGroup(group)));
  renderMoreButton();
  updateActionBar();
}

function fetchGroupPage(page) {
  const params = new URLSearchParams({
    page: String(page),
    page_size: String(PAGE_SIZE),
    sort: sortBy,
  });
  if (query) params.set('q', query);
  return api('/duplicates?' + params.toString());
}

// Everything past the first page used to be unreachable — 208 of 408 groups
// existed only in the worker, with nothing on screen admitting it.
function renderMoreButton() {
  const existing = el('btn-more');
  if (existing) existing.remove();

  if (groups.length >= totalGroups) return;

  const remaining = totalGroups - groups.length;
  const button = document.createElement('button');
  button.id = 'btn-more';
  button.textContent = `Show ${count(Math.min(remaining, PAGE_SIZE))} more of ${count(remaining)} remaining`;

  button.onclick = async () => {
    button.disabled = true;
    button.textContent = 'Loading…';
    try {
      const page = await fetchGroupPage(pagesLoaded + 1);
      pagesLoaded++;
      groups = groups.concat(page.groups);
      totalGroups = page.total_groups;

      const list = el('group-list');
      page.groups.forEach((group) => list.appendChild(renderGroup(group)));
      renderMoreButton();
    } catch (err) {
      showError(err.message);
      button.disabled = false;
    }
  };

  el('group-list').after(button);
}

function renderGroup(group) {
  const node = document.createElement('div');
  node.className = 'group';
  node.innerHTML = `
    <div class="group-head">
      <span class="chevron">▶</span>
      <span class="reclaim">${bytes(group.reclaimable_bytes)}
        <span class="reclaim-label">reclaimable</span></span>
      <span>${group.copies} copies</span>
      <span class="spacer"></span>
      <button class="small keep-one">Keep one</button>
      <span class="badge ${group.match_type === 'exact' ? '' : 'reenc'}">
        ${group.match_type}
      </span>
    </div>
    <div class="files"></div>`;

  const box = node.querySelector('.files');

  async function fill() {
    box.innerHTML = '';
    const files = await groupDetail(group.group_id);
    files.forEach((file) => box.appendChild(renderFile(file)));
  }

  node.querySelector('.group-head').onclick = async (event) => {
    if (event.target.closest('.keep-one')) return;
    const open = node.classList.toggle('open');
    open ? openGroups.add(group.group_id) : openGroups.delete(group.group_id);
    if (open) await fill();
  };

  // Per-group version of the header button, for when a producer wants to
  // decide one sound at a time rather than trust the whole library at once.
  node.querySelector('.keep-one').onclick = async (event) => {
    event.stopPropagation();
    const files = await groupDetail(group.group_id);
    files.forEach((f) => { if (!f.suggested_keep) selected.add(f.file_id); });
    if (node.classList.contains('open')) await fill();
    updateActionBar();
  };

  if (openGroups.has(group.group_id)) {
    node.classList.add('open');
    fill();
  }

  return node;
}

function renderFile(file) {
  const row = document.createElement('div');
  row.className = 'file';

  const tick = document.createElement('input');
  tick.type = 'checkbox';
  tick.checked = selected.has(file.file_id);
  // A tick is a proposal, never an instruction. The worker refuses any
  // selection that would leave a sample with zero copies, whatever this
  // page sends it.
  tick.onchange = () => {
    tick.checked ? selected.add(file.file_id) : selected.delete(file.file_id);
    updateActionBar();
  };

  const play = document.createElement('button');
  play.className = 'play' + (playingId === file.file_id ? ' playing' : '');
  play.textContent = playingId === file.file_id ? '■' : '▶';
  play.title = 'Listen before you remove it';
  play.onclick = () => togglePlay(file.file_id, play, `/audio/${file.file_id}`);

  const body = document.createElement('div');
  body.className = 'file-main';
  body.innerHTML = `
    <div class="file-name">${highlight(file.filename)}
      <span class="file-size">${bytes(file.size)}</span>
      ${file.suggested_keep ? '<span class="keep">KEEP</span>' : ''}</div>
    <div class="file-path">${escapeHtml(file.path)}</div>`;

  row.appendChild(tick);
  row.appendChild(play);
  row.appendChild(body);
  return row;
}

// ── Quarantine view ─────────────────────────────────────────────────────────

// A batch's contents, fetched on first need and kept. Searching has to look
// inside batches that are not open, so it would otherwise re-fetch every
// batch on every keystroke.
const quarantineItems = new Map();
let quarantineQuery = '';
let quarantineSearchTimer = null;

async function batchItems(batchId) {
  if (quarantineItems.has(batchId)) return quarantineItems.get(batchId);
  const detail = await api('/quarantine/' + encodeURIComponent(batchId));
  quarantineItems.set(batchId, detail.items);
  return detail.items;
}

// Same job as highlight(), but against a term passed in rather than the
// library search box — the two searches are separate.
function markMatch(value, term) {
  const safe = escapeHtml(value);
  if (!term) return safe;
  const pattern = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), (hit) => `<mark>${hit}</mark>`);
}

function matchesQuarantine(item) {
  if (!quarantineQuery) return true;
  return baseName(item.original_path)
    .toLowerCase()
    .includes(quarantineQuery.toLowerCase());
}

function renderQuarantineFile(item) {
  const row = document.createElement('div');
  row.className = 'qfile';

  // Prefixed so a quarantined file and a library file can never share a
  // playing key and leave the wrong button stuck showing stop.
  const key = 'q' + item.id;

  const play = document.createElement('button');
  play.className = 'play' + (playingId === key ? ' playing' : '');
  play.textContent = playingId === key ? '■' : '▶';
  play.title = 'Listen before you delete it';
  play.onclick = () => togglePlay(key, play, `/quarantine/items/${item.id}/audio`);

  const body = document.createElement('div');
  body.className = 'file-main';
  body.innerHTML = `
    <div class="file-name">${markMatch(baseName(item.original_path), quarantineQuery)}
      <span class="file-size">${bytes(item.size)}</span></div>
    <div class="file-path">${escapeHtml(item.original_path)}</div>`;

  // Per-file version of the batch's Put back. A producer going through a
  // batch usually wants a handful of samples back, not all of them, and
  // restoring the whole batch to rescue three is not a real option.
  const restore = document.createElement('button');
  restore.className = 'small';
  restore.textContent = 'Put back';
  restore.onclick = async () => {
    restore.disabled = true;
    restore.textContent = 'Putting back…';
    try {
      const result = await api(`/quarantine/items/${item.id}/restore`, { method: 'POST' });
      groupFiles.clear();
      quarantineItems.clear();   // this file has left its batch

      if (playingId === 'q' + item.id) stopAudio();

      await loadQuarantine();

      if (result.relocated) {
        showNotice(
          `That file couldn't go back — the folder it came from no longer ` +
          `exists. It's in: ${result.relocated_to.replace(/\/[^/]+$/, '')}`
        );
      }
      if (result.failures.length) {
        showError(result.failures[0].error);
      }
    } catch (err) {
      restore.disabled = false;
      restore.textContent = 'Put back';
      showError(err.message);
    }
  };

  row.appendChild(play);
  row.appendChild(body);
  row.appendChild(restore);
  return row;
}

async function loadQuarantine() {
  view = 'quarantine';
  el('action-bar').style.display = 'none';
  stopAudio();
  updateChrome();

  const data = await api('/quarantine');
  const live = data.batches.filter((b) => !b.purged_at && b.file_count > 0);

  if (live.length === 0) {
    quarantineQuery = '';
    main.innerHTML = `
      <div class="center">
        <div style="font-size:18px;font-weight:600">Quarantine is empty</div>
        <p>Files you remove are staged here first, and can be put back.</p>
      </div>`;
    return;
  }

  // Said every time, not just once. "Quarantine" sounds like deletion, and
  // a producer looking at 568 of their samples in a list wants to be told
  // plainly that they still have them.
  main.innerHTML = `
    <p class="hint" style="margin:0 0 16px;max-width:620px">
      These files have left your library but are still on your disk. Put back
      returns every one of them to where it came from. Delete permanently is
      the only thing here that cannot be undone.
    </p>
    <input id="q-search" class="qsearch" type="search"
           placeholder="Search quarantined samples" autocomplete="off" spellcheck="false">
    <p class="hint" id="q-note" style="margin:0 0 12px"></p>
    <div id="batch-list"></div>`;
  const list = el('batch-list');

  // The app found files in quarantine that its index had lost — almost
  // always because it was killed mid-move. Worth saying plainly: a
  // producer who force-quit and came back to a short library needs to
  // know the samples are here, not gone.
  if (!recoveryNoticeShown && data.recovered && data.recovered.files > 0) {
    recoveryNoticeShown = true;
    showNotice(
      `${count(data.recovered.files)} file${data.recovered.files === 1 ? '' : 's'} ` +
      `were recovered into quarantine after the app closed unexpectedly. ` +
      `Nothing was lost — Put back returns them to where they came from.`
    );
  }

  const rendered = [];

  // Draws whatever currently matches into one batch's open area, and says
  // how many that was.
  async function fill(entry) {
    const items = await batchItems(entry.batch.id);
    const matches = items.filter(matchesQuarantine);
    entry.box.innerHTML = '';
    matches.forEach((item) => entry.box.appendChild(renderQuarantineFile(item)));
    entry.filled = true;
    return matches.length;
  }

  // Searching opens every batch that has a hit and hides the ones that
  // don't, so a producer looking for one sample is not left clicking
  // through batches to find out which one holds it.
  async function applySearch() {
    const note = el('q-note');

    if (!quarantineQuery) {
      note.textContent = '';
      for (const entry of rendered) {
        entry.node.style.display = '';
        if (entry.node.classList.contains('open')) await fill(entry);
      }
      return;
    }

    note.textContent = 'Searching…';
    let total = 0;

    for (const entry of rendered) {
      let hits;
      try {
        hits = await fill(entry);
      } catch (err) {
        note.textContent = '';
        showError(err.message);
        return;
      }
      total += hits;
      entry.node.style.display = hits ? '' : 'none';
      entry.node.classList.toggle('open', hits > 0);
    }

    note.textContent = total
      ? `${count(total)} file${total === 1 ? '' : 's'} matching "${quarantineQuery}"`
      : `No quarantined file is named "${quarantineQuery}"`;
  }

  live.forEach((batch) => {
    const when = new Date(batch.created_at * 1000).toLocaleString();

    const node = document.createElement('div');
    node.className = 'qbatch';
    node.innerHTML = `
      <div class="batch">
        <span class="chevron">▶</span>
        <div style="flex:1">
          <div>${count(batch.file_count)} files &middot; ${bytes(batch.bytes)}</div>
          <div class="stat-label">${when}</div>
        </div>
      </div>
      <div class="qfiles"></div>`;

    const head = node.querySelector('.batch');
    const entry = { batch, node, box: node.querySelector('.qfiles'), filled: false };
    rendered.push(entry);

    head.onclick = async (event) => {
      // Put back and Delete permanently live in this row and are not
      // requests to expand it.
      if (event.target.closest('button')) return;

      const open = node.classList.toggle('open');
      if (!open || entry.filled) return;

      entry.box.innerHTML = '<div class="qfile hint">Loading…</div>';
      try {
        await fill(entry);
      } catch (err) {
        entry.box.innerHTML = '';
        node.classList.remove('open');
        showError(err.message);
      }
    };

    const restore = document.createElement('button');
    restore.textContent = 'Put back';
    restore.onclick = async () => {
      try {
        const result = await api(`/quarantine/${batch.id}/restore`, { method: 'POST' });
        groupFiles.clear();
        quarantineItems.clear();   // these files are no longer in quarantine

        // Redraw first: it replaces main's contents, so anything said
        // before it would be wiped before the producer could read it.
        await loadQuarantine();

        // A file whose original folder no longer exists went somewhere
        // else. Saying nothing would leave a producer looking for
        // samples in a folder they themselves renamed.
        if (result.relocated) {
          showNotice(
            `${count(result.relocated)} file${result.relocated === 1 ? '' : 's'} ` +
            `couldn't go back — the folder they came from no longer exists. ` +
            `They're in: ${result.relocated_to.replace(/\/[^/]+$/, '')}`
          );
        }

        if (result.failures.length) {
          showError(`${result.failures.length} file(s) could not be put back.`);
        }
      } catch (err) { showError(err.message); }
    };

    // The only destructive action in the app, and deliberately a separate
    // second step the producer takes on purpose.
    const purge = document.createElement('button');
    purge.className = 'danger';
    purge.textContent = 'Delete permanently';
    purge.onclick = async () => {
      if (!confirm(
        `Permanently delete ${batch.file_count} file(s)?\n\n` +
        `This frees ${bytes(batch.bytes)} and cannot be undone.`
      )) return;
      try {
        await api(`/quarantine/${batch.id}`, { method: 'DELETE' });
        quarantineItems.delete(batch.id);
        loadQuarantine();
      } catch (err) { showError(err.message); }
    };

    head.appendChild(restore);
    head.appendChild(purge);
    list.appendChild(node);
  });

  // Debounced: each keystroke re-renders every batch's file list, and a
  // producer typing "808" should pay for that once, not three times.
  const search = el('q-search');
  search.value = quarantineQuery;
  search.oninput = (event) => {
    quarantineQuery = event.target.value.trim();
    clearTimeout(quarantineSearchTimer);
    quarantineSearchTimer = setTimeout(applySearch, 220);
  };

  // A redraw after Put back must not silently drop the filter the
  // producer is still looking through.
  if (quarantineQuery) await applySearch();
}

// Three panels behind one gear: the folders being scanned, whether a newer
// build exists, and what this app is. None of them are things a producer
// visits mid-task, which is why they are one icon rather than three words
// in the header.
const SETTINGS_TABS = [
  ['folders', 'Folders'],
  ['guide',   'Guide'],
  ['updates', 'Updates'],
  ['about',   'About'],
];

  view = 'settings';
  el('action-bar').style.display = 'none';
  stopAudio();
  updateChrome();

  main.innerHTML = `
    <div style="max-width:640px">
      <div class="tabs">
        ${SETTINGS_TABS.map(([id, label]) =>
          `<button class="tab ${id === tab ? 'active' : ''}" data-tab="${id}">${label}</button>`
        ).join('')}
      </div>
      <div id="settings-panel"></div>
    </div>`;

  main.querySelectorAll('.tab').forEach((button) => {
    button.onclick = () => loadSettings(button.dataset.tab);

  const panel = el('settings-panel');
  if (tab === 'folders') await renderFoldersTab(panel);
  else if (tab === 'guide') renderGuideTab(panel);
  else if (tab === 'updates') await renderUpdatesTab(panel);
  else await renderAboutTab(panel);
}

       be undone, and it only happens when you choose it. Nothing is ever deleted on
       a timer, on launch, or as a side effect of anything else.`,
      `There is no rush. Quarantined files can sit there as long as you like.`,
    ],
  },
];

function renderGuideTab(panel) {
  panel.innerHTML = `
    <p class="hint" style="margin:0 0 4px">
      Seven steps, start to finish. Hover a step to see the control it means.
    </p>
    <div id="guide-list"></div>`;

  const list = el('guide-list');

  GUIDE_STEPS.forEach((step, index) => {
    const node = document.createElement('div');
    node.className = 'guide-step';
    node.innerHTML = `
      <div class="guide-num">${String(index + 1).padStart(2, '0')}</div>
      <div class="guide-body">
        <h4>${escapeHtml(step.title)}</h4>
        ${step.body.map((p) => `<p>${p}</p>`).join('')}
      </div>`;

    // Rings the real button in the header while the step is hovered. Only
    // controls that exist on every screen can be pointed at this way —
    // anything inside the library view is described in words instead,
    // because the library is not on screen while Settings is.
    if (step.highlight) {
      const target = el(step.highlight);
      if (target) {
        node.onmouseenter = () => target.classList.add('spotlight');
        node.onmouseleave = () => target.classList.remove('spotlight');
      }
    }

    list.appendChild(node);
  });
}

  // Unreachable is not an error. The app works offline by design, and a

  if (!info.reachable) {
    panel.innerHTML = `

    return;
  }

  if (!info.newer) {
    panel.innerHTML = `
      <div class="batch">
        <div style="flex:1">
          <div>You're up to date</div>
          <div class="stat-label">Version ${escapeHtml(info.current)}</div>
        </div>

    return;
  }

  panel.innerHTML = `
    <div class="batch">

function renderRoot(root) {
  const row = document.createElement('div');
  row.className = 'batch'; // reuse the quarantine-batch row styling
  row.innerHTML = `<div style="flex:1" class="file-path">${escapeHtml(root.path)}</div>`;

  const remove = document.createElement('button');
  remove.className = 'danger';
  remove.textContent = 'Remove';
  remove.onclick = async () => {
    if (!confirm(
      `Stop scanning "${root.path}"?\n\n` +
      `Nothing on disk is touched. Uforiya forgets everything it found ` +
      `here — your duplicate list updates right away.`
    )) return;
    try {
      await api(`/library/roots/${encodeURIComponent(root.id)}`, { method: 'DELETE' });
      groupFiles.clear();
      loadSettings();
    } catch (err) { showError(err.message); }
  };

  row.appendChild(remove);
  return row;
}


// ── Updates ─────────────────────────────────────────────────────────────────

// Run once on launch rather than only when someone opens Settings, so a
// producer on an old build finds out without going looking for it.
//
// A dismissal is remembered against the version it declined, so "not now"
// on 0.2.0 stays quiet until 0.3.0 exists — rather than asking again every
// single launch, which is how a banner teaches people to ignore it.
async function checkForUpdateOnLaunch() {
  let info;
  try {
    info = await window.uforiya.checkForUpdate();
  } catch (err) {
    return;   // offline, or the site moved. Neither is worth saying anything about.
  }

  if (!info.reachable || !info.newer) return;

  let dismissed = null;
  try {
    dismissed = localStorage.getItem('dismissed-update');
  } catch (err) {
    // Storage unavailable. Showing the banner is the safer failure.
  }
  if (dismissed === info.latest) return;

  el('update-text').textContent =
    `Version ${info.latest} is available. You're on ${info.current}.`;
  el('update-bar').style.display = 'flex';

  el('btn-update-get').onclick = () => window.open(info.url, '_blank');

  el('btn-update-dismiss').onclick = () => {
    try { localStorage.setItem('dismissed-update', info.latest); } catch (err) {}
    el('update-bar').style.display = 'none';
  };
}


// ── Selection ───────────────────────────────────────────────────────────────

function updateActionBar() {
  const bar = el('action-bar');
  if (view !== 'library' || selected.size === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  el('selection-count').textContent =
    `${count(selected.size)} file${selected.size === 1 ? '' : 's'} selected`;
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

// Paths in the index are normalised to forward slashes on every platform
// (platform_paths.normalize_path), so one separator is enough.
function baseName(path) {
  return path.slice(path.lastIndexOf('/') + 1) || path;
}

// Back appears wherever the library isn't. One control rather than each
// view remembering to offer its own way out.
function updateChrome() {
  el('btn-back').style.display = view === 'library' ? 'none' : 'inline-block';
  // Search only means anything against the duplicate list.
  el('search').style.display = view === 'library' ? 'inline-block' : 'none';
  // A ring left behind by a guide step the mouse never left would follow
  // the producer out of Settings.
  document.querySelectorAll('.spotlight').forEach((n) => n.classList.remove('spotlight'));
}


// ── Star field ──────────────────────────────────────────────────────────────

// The house background, shared with every other Uforiya app. It renders
// behind the content and takes no clicks, so it cannot come between a
// producer and a decision about their files.
(function starfield() {
  const canvas = el('stars');
  const ctx = canvas.getContext('2d');
  const pointer = { x: -9999, y: -9999 };
  let w = 0, h = 0, points = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Density scales with area, so a maximised window isn't sparse and a
    // small one isn't cluttered.
    const n = Math.round((w * h) / 3500);
    points = Array.from({ length: n }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.1 + 0.3,
      base: Math.random() * 0.35 + 0.12,
      speed: Math.random() * 0.0012 + 0.0004,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() < 0.25 ? '#9b7ff7' : '#e8e8f0',
    }));
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);

    for (const p of points) {
      // Each star twinkles on its own phase, so the field never pulses
      // in unison — that reads as a broken screen rather than a sky.
      let alpha = p.base + Math.sin(p.phase + t * p.speed) * 0.14;
      let ox = 0, oy = 0;

      const dx = p.x - pointer.x;
      const dy = p.y - pointer.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Stars near the cursor brighten and drift slightly. Enough to feel
      // alive; not enough to pull the eye off a list of filenames.
      if (dist < 130) {
        const force = 1 - dist / 130;
        alpha += force * 0.45;
        ox = dx * force * 0.07;
        oy = dy * force * 0.07;
      }

      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x + ox, p.y + oy, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  });
  document.addEventListener('mouseleave', () => {
    pointer.x = pointer.y = -9999;
  });

  resize();
  requestAnimationFrame(frame);
})();

el('btn-rescan').onclick = async () => {

el('btn-quarantine-view').onclick = () => {

};

el('btn-home').onclick = () => { if (view !== 'library') loadLibrary(); };
el('btn-back').onclick = () => loadLibrary();

// Debounced: each keystroke is a round trip to the worker and a redraw of
// the list, and a producer typing "808" should cost one of those, not three.
el('search').oninput = (event) => {
  query = event.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    // Open groups and cached members belong to the previous result set.
    openGroups.clear();
    loadLibrary();
  }, 220);
};
el('btn-clear').onclick = async () => {
  selected.clear();
  await loadLibrary();
};

// Ticks every copy except the one the worker suggests keeping, across every
// group the current view covers — not just the page that happens to be
// rendered.
//
// This used to promise the library-wide figure and then quietly act on the
// first 200 groups, which meant two rounds of clicking to finish one job.
// It now walks every page itself, and the number in the confirm is the
// number it will actually select.
async function keepOneOfEach() {
  if (!totals) return;

  if (!confirm(
    `Select every extra copy across ${count(totalGroups)} duplicate group${totalGroups === 1 ? '' : 's'}?\n\n` +
    (query ? `Only groups matching "${query}" are affected. ` : '') +
    `One copy of every sample stays where it is. ` +
    `Nothing moves until you choose to move it.`
  )) return;

  const working = showWorking('Selecting extra copies');

  try {
    // Pages the worker rather than trusting what is on screen. Pages
    // already fetched are reused; the rest are pulled as needed.
    const all = groups.slice();
    let page = pagesLoaded;

    while (all.length < totalGroups) {
      working.update(all.length, totalGroups, `Reading group list…`);
      const next = await fetchGroupPage(++page);
      if (!next.groups.length) break;   // worker disagrees about the total; stop rather than loop
      all.push(...next.groups);
    }

    let index = 0;
    for (const group of all) {
      const files = await groupDetail(group.group_id);
      files.forEach((f) => { if (!f.suggested_keep) selected.add(f.file_id); });
      index++;
      working.update(index, all.length, `${count(index)} of ${count(all.length)} groups`);
    }
  } catch (err) {
    showError(err.message);
  } finally {
    working.done();
  }

  // Redraw so already-open groups show their new ticks.
  await loadLibrary();
}

el('btn-remove').onclick = async () => {
  const ids = [...selected];
  if (!confirm(
    `Move ${count(ids.length)} file(s) to quarantine?\n\n` +
    `They leave your library but are not deleted — you can put them back.`
  )) return;

  stopAudio();

  // The worker moves every file in one request and answers when it is
  // finished, so there is no progress to report — but several hundred file
  // operations take long enough that silence reads as a hang.
  const working = showWorking('Moving files to quarantine');
  working.update(1, 1, `${count(ids.length)} file${ids.length === 1 ? '' : 's'}`);

  try {
    const result = await api('/quarantine', {
      method: 'POST',
      body: JSON.stringify({ file_ids: ids }),
    });
    selected.clear();
    groupFiles.clear();
    if (result.failures.length) {
      showError(`${result.failures.length} file(s) could not be moved.`);
    }
    // A scan reconciles the index with what is now on disk.
    const scan = await api('/scan', { method: 'POST' });
    watchJob(scan.job_id);
  } catch (err) {
    showError(err.message);
  } finally {
    working.done();
  }
};


// ── Start ───────────────────────────────────────────────────────────────────

(async () => {
  const info = await window.uforiya.getWorkerInfo();
  API = `http://127.0.0.1:${info.port}`;
  TOKEN = info.token;
  AUTH = `Bearer ${info.token}`;

  await loadLibrary();

  // Deliberately not awaited. A slow or unreachable site must never delay
  // the app a producer opened to do a job.
  checkForUpdateOnLaunch();

  // A rescan on launch costs almost nothing when nothing has changed, and
  // means the list reflects what is actually on disk rather than what was
  // there last session.
  const roots = await api('/library/roots');
  if (roots.roots.length > 0) {
    const scan = await api('/scan', { method: 'POST' });
    watchJob(scan.job_id);
  }
})();
